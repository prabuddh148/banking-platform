# Builds the React frontend in MOCK mode (no backend needed) and publishes it to
# GitHub Pages: https://<user>.github.io/banking-platform/
# Runs on every push to main that touches frontend/, or manually from the Actions tab.
name: Deploy frontend demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build (mock data, served under /<repo>/)
        env:
          VITE_USE_MOCK: "true"
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      # GitHub Pages has no server-side routing. Give every app route its own
      # index.html so shared links (e.g. /banking-platform/login) return HTTP 200,
      # and keep 404.html as the fallback for anything else.
      - name: Add static entry points for app routes
        run: |
          cp dist/index.html dist/404.html
          for route in login architecture accounts transfer transactions notifications \
                       admin admin/accounts admin/transactions admin/fraud admin/events \
                       admin/audit admin/services; do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
