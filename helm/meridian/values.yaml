# -----------------------------------------------------------------------------
# Meridian Helm values.
#
#   helm install meridian helm/meridian                          # everything in-cluster (dev)
#   helm install meridian helm/meridian -f my-values.yaml        # override anything below
#
# Images are built and pushed to GHCR by .github/workflows/images.yml as
#   ghcr.io/prabuddh148/meridian-<service>:<tag>
# -----------------------------------------------------------------------------

image:
  registry: ghcr.io/prabuddh148
  # Image name = <registry>/<prefix><service name>
  prefix: meridian-
  tag: latest
  pullPolicy: IfNotPresent
imagePullSecrets: []

# ---- Secrets (dev defaults only - override in real environments, or set existingSecret) ----
secrets:
  # Use a Secret you manage yourself (keys: JWT_SECRET, DB_PASSWORD) instead of the one below.
  existingSecret: ""
  jwtSecret: change-me-dev-secret-key-at-least-32-bytes-long
  dbPassword: banking

# ---- Settings shared by every service ----
common:
  jwtExpiry: PT1H
  springProfilesActive: ""
  javaToolOptions: "-XX:MaxRAMPercentage=75 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
  tracingEnabled: false
  outboxRelayIntervalMs: 2000

# ---- Defaults for every service Deployment (each service can override) ----
serviceDefaults:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { memory: 768Mi }
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /actuator/prometheus

# ---- The services. dbName empty = service has no database (gateway). ----
services:
  account-service:
    port: 8081
    dbName: accounts_db
  transaction-service:
    port: 8082
    dbName: transactions_db
  fraud-service:
    port: 8083
    dbName: fraud_db
  notification-service:
    port: 8084
    dbName: notifications_db
    env:
      MAIL_HOST: mailhog
      MAIL_PORT: "1025"
  audit-service:
    port: 8085
    dbName: audit_db
  api-gateway:
    port: 8080
    dbName: ""
    env:
      CORS_ALLOWED_ORIGINS: http://localhost:5173

# ---- Ingress for the API gateway ----
ingress:
  enabled: false
  className: nginx
  host: meridian.local
  annotations: {}
  tls: []   # e.g. [{ secretName: meridian-tls, hosts: [meridian.local] }]

# ---- PostgreSQL: in-cluster StatefulSet (dev) or an external server ----
postgresql:
  enabled: true                 # false = use external.host below
  image: postgres:16-alpine
  username: banking
  storage: 5Gi
  storageClassName: ""          # "" = cluster default
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }
  external:
    host: ""
    port: 5432

# ---- Kafka: in-cluster single-node KRaft broker (dev) or an external cluster ----
kafka:
  enabled: true                 # false = use externalBootstrapServers
  image: apache/kafka:3.7.1
  storage: 5Gi
  storageClassName: ""
  partitions: 3
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { memory: 1Gi }
  heapOpts: "-Xms256m -Xmx512m"
  externalBootstrapServers: ""
