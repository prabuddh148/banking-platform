<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Meridian: a microservices banking platform (Spring Boot, Kafka, PostgreSQL) with a React customer app and operations console." />
    <meta name="theme-color" content="#4f46e5" />
    <meta property="og:title" content="Meridian Banking Platform" />
    <meta property="og:description" content="Event-driven banking on Spring Boot microservices: saga transfers, fraud engine, audit trail. Try the live demo." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Meridian · Banking Platform</title>
    <script>
      // Apply the saved/OS theme before the first paint (no light flash in dark mode).
      (function () {
        var t = null
        try {
          // ?theme=light|dark|system overrides and remembers the choice (handy for demos/screenshots)
          var q = new URLSearchParams(location.search).get('theme')
          if (q === 'light' || q === 'dark' || q === 'system') localStorage.setItem('meridian.theme', q)
          t = localStorage.getItem('meridian.theme')
        } catch (e) {}
        var dark = t === 'dark' || ((!t || t === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
