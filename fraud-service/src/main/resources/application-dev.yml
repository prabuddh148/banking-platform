# Local development tweaks: activate with SPRING_PROFILES_ACTIVE=dev
spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.banking: DEBUG
    org.springframework.kafka: INFO
    org.hibernate.SQL: DEBUG
