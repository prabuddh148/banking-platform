# =============================================================================
# Banking Platform - Kafka Topic Definitions
# =============================================================================
# This file documents all Kafka topics used by the banking platform.
# It serves as the authoritative reference for topic configuration and ownership.
#
# For actual topic creation, run:
#   infrastructure/kafka/topics/create-topics.sh
# =============================================================================

topics:

  # ---------------------------------------------------------------------------
  # ACCOUNT DOMAIN
  # ---------------------------------------------------------------------------

  - name: account.created
    partitions: 6
    replication-factor: 1
    retention-ms: 604800000
    cleanup-policy: delete
    description: >
      Published when a new bank account is successfully created and persisted.
      Downstream services use this event to initialize account-related state.
    producer:
      service: account-service
      key: accountId (UUID string)
      ordering-guarantee: per-account
    consumers:
      - service: fraud-service
        group-id: fraud-service-account-consumer
        purpose: Initialize velocity tracking and risk profile for new account
      - service: audit-service
        group-id: audit-service-account-consumer
        purpose: Record account creation in the immutable audit log
      - service: notification-service
        group-id: notification-service-account-consumer
        purpose: Send welcome email/SMS to new account holder

  - name: account.created.DLT
    partitions: 6
    replication-factor: 1
    retention-ms: 2592000000
    cleanup-policy: delete
    description: Dead Letter Topic for account.created. 30-day retention for investigation.
    producer:
      service: Spring Kafka error handler (automatic)

  - name: account.status.changed
    partitions: 6
    replication-factor: 1
    retention-ms: 604800000
    cleanup-policy: delete
    description: >
      Published when an account status transitions (PENDING->ACTIVE, ACTIVE->SUSPENDED, etc.).
      Critical for downstream services to enforce business rules.
    producer:
      service: account-service
      key: accountId (UUID string)
    consumers:
      - service: transaction-service
        group-id: transaction-service-account-status-consumer
        purpose: Maintain local cache of account statuses to enforce transaction eligibility
      - service: fraud-service
        group-id: fraud-service-account-status-consumer
        purpose: Adjust risk scoring for suspended/reactivated accounts
      - service: notification-service
        group-id: notification-service-account-status-consumer
        purpose: Notify account holder of status changes
      - service: audit-service
        group-id: audit-service-account-status-consumer
        purpose: Record status transitions with timestamp and reason

  - name: account.status.changed.DLT
    partitions: 6
    replication-factor: 1
    retention-ms: 2592000000
    cleanup-policy: delete
    description: Dead Letter Topic for account.status.changed events.

  # ---------------------------------------------------------------------------
  # TRANSACTION DOMAIN
  # ---------------------------------------------------------------------------

  - name: transaction.initiated
    partitions: 12
    replication-factor: 1
    retention-ms: 604800000
    cleanup-policy: delete
    description: >
      Published by transaction-service when a new transaction request is received
      and initial validation passes. Starts the transaction saga.
    producer:
      service: transaction-service
      key: transactionId (UUID string)
      ordering-guarantee: per-transaction
    consumers:
      - service: fraud-service
        group-id: fraud-service-transaction-consumer
        purpose: Perform fraud detection and publish fraud.decision
      - service: audit-service
        group-id: audit-service-transaction-consumer
        purpose: Record transaction initiation

  - name: transaction.initiated.DLT
    partitions: 6
    replication-factor: 1
    retention-ms: 2592000000
    cleanup-policy: delete
    description: Dead Letter Topic for transaction.initiated events.

  - name: transaction.processing
    partitions: 12
    replication-factor: 1
    retention-ms: 604800000
    cleanup-policy: delete
    description: >
      Published by the transaction-service saga orchestrator after fraud checks pass.
      Signals that the transaction is approved to proceed with fund transfer.
    producer:
      service: transaction-service (saga orchestrator)
      key: transactionId (UUID string)
    consumers:
      - service: account-service
        group-id: account-service-transaction-consumer
        purpose: Execute debit and credit operations on source and destination accounts
      - service: audit-service
        group-id: audit-service-tx-processing-consumer
        purpose: Record transaction state change to PROCESSING

  - name: transaction.processing.DLT
    partitions: 6
    replication-factor: 1
    retention-ms: 2592000000
    cleanup-policy: delete
    description: Dead Letter Topic for transaction.processing events.

  - name: transaction.completed
    partitions: 12
    replication-factor: 1
    retention-ms: 604800000
    cleanup-policy: delete
    description: >
      Published when a transaction has been successfully settled. Terminal success
      event for the transaction saga.
    producer:
      service: transaction-service (saga orchestrator)
      key: transactionId (UUID string)
    consumers:
      - service: notification-service
        group-id: notification-service-tx-consumer
        purpose: Send transaction confirmation notification to account holder
      - service: audit-service
        group-id: audit-service-tx-completed-consumer
        purpose: Record final transaction completion and settlement details

  - name: transaction.completed.DLT
    partitions: 6
    replication-factor: 1
    retention-ms: 2592000000
    cleanup-policy: delete
    description: Dead Letter Topic for transaction.completed events.

  - name: transaction.failed
    partitions: 12
    replication-factor: 1
    retention-ms: 604800000
    cleanup-policy: delete
    description: >
      Published when a transaction fails for any reason: fraud detected,
      insufficient funds, account suspended, or saga rollback.
    producer:
      service: transaction-service (saga orchestrator)
      key: transactionId (UUID string)
    consumers:
      - service: notification-service
        group-id: notification-service-tx-failed-consumer
        purpose: Notify account holder of failed transaction and reason
      - service: audit-service
        group-id: audit-service-tx-failed-consumer
        purpose: Record transaction failure with cause for compliance/support

  - name: transaction.failed.DLT
    partitions: 6
    replication-factor: 1
    retention-ms: 2592000000
    cleanup-policy: delete
    description: Dead Letter Topic for transaction.failed events.

  # ---------------------------------------------------------------------------
  # FRAUD DOMAIN
  # ---------------------------------------------------------------------------

  - name: fraud.decision
    partitions: 12
    replication-factor: 1
    retention-ms: 604800000
    cleanup-policy: delete
    description: >
      Published by fraud-service after evaluating transaction risk score.
      Contains decision (APPROVED/REJECTED/MANUAL_REVIEW) and risk score (0-100).
      Co-partitioned with transaction topics (same key = transactionId).
    producer:
      service: fraud-service
      key: transactionId (UUID string)
      ordering-guarantee: per-transaction (co-partitioned with transaction topics)
    consumers:
      - service: transaction-service
        group-id: transaction-service-fraud-decision-consumer
        purpose: Advance or abort the transaction saga based on fraud decision
      - service: audit-service
        group-id: audit-service-fraud-decision-consumer
        purpose: Record fraud decision for compliance reporting

  - name: fraud.decision.DLT
    partitions: 6
    replication-factor: 1
    retention-ms: 2592000000
    cleanup-policy: delete
    description: Dead Letter Topic for fraud.decision events.

  - name: fraud.detected
    partitions: 6
    replication-factor: 1
    retention-ms: 604800000
    cleanup-policy: delete
    description: >
      Published only for high-confidence fraud cases (risk score >= threshold).
      Triggers automatic account suspension and fraud team alerts.
      Lower volume than fraud.decision.
    producer:
      service: fraud-service
      key: accountId (UUID string)
    consumers:
      - service: account-service
        group-id: account-service-fraud-detected-consumer
        purpose: Automatically suspend the affected account
      - service: notification-service
        group-id: notification-service-fraud-detected-consumer
        purpose: Send urgent fraud alert to account holder via all channels
      - service: audit-service
        group-id: audit-service-fraud-detected-consumer
        purpose: Create a priority audit entry and trigger compliance workflow

  - name: fraud.detected.DLT
    partitions: 6
    replication-factor: 1
    retention-ms: 2592000000
    cleanup-policy: delete
    description: Dead Letter Topic for fraud.detected events.

  # ---------------------------------------------------------------------------
  # NOTIFICATION DOMAIN
  # ---------------------------------------------------------------------------

  - name: notification.requested
    partitions: 6
    replication-factor: 1
    retention-ms: 604800000
    cleanup-policy: delete
    description: >
      Published by any service that needs to send a user notification.
      The notification-service routes to the appropriate channel (email/SMS/push)
      based on user preferences and notification type.
    producer:
      service: any service (account-service, transaction-service, fraud-service)
      key: userId or accountId (UUID string)
    consumers:
      - service: notification-service
        group-id: notification-service-requested-consumer
        purpose: Route and deliver notifications via configured channels
      - service: audit-service
        group-id: audit-service-notification-consumer
        purpose: Record that a notification was requested (for compliance)

  - name: notification.requested.DLT
    partitions: 6
    replication-factor: 1
    retention-ms: 2592000000
    cleanup-policy: delete
    description: >
      Dead Letter Topic for notification.requested events. Failed notifications
      end up here after retry exhaustion and require manual investigation.
    consumers:
      - service: ops-tooling
        group-id: ops-notification-dlt-monitor
        purpose: Alert support team and trigger manual notification fallback
