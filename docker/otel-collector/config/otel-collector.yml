# OpenTelemetry Collector pipeline for local development.
#
#   services --OTLP--> receivers --> processors --> exporters
#
# Services send traces to http://otel-collector:4318/v1/traces when
# TRACING_ENABLED=true (micrometer-tracing + OTLP exporter).

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Protects the collector from running out of memory under load.
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100
  # Sends data in batches (fewer, bigger requests).
  batch:
    timeout: 5s
    send_batch_size: 1024
  # Tag everything with the environment.
  resource:
    attributes:
      - key: deployment.environment
        value: local
        action: upsert
  # Keep 100% of traces locally; see infrastructure/observability/otel/sampling-config.yml
  # for the tail-sampling policy intended for shared environments.
  probabilistic_sampler:
    sampling_percentage: 100

exporters:
  # Prints spans/metrics summary to the collector log (docker compose logs otel-collector).
  debug:
    verbosity: basic
  # Exposes OTLP metrics in Prometheus format; scraped by Prometheus (job otel-collector-exported).
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: otel
    resource_to_telemetry_conversion:
      enabled: true

service:
  extensions: [health_check]
  telemetry:
    metrics:
      address: 0.0.0.0:8888
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, probabilistic_sampler, resource, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [debug]
