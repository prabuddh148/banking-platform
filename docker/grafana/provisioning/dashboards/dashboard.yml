apiVersion: 1

providers:
  - name: Banking Dashboards
    orgId: 1
    folder: Banking
    folderUid: banking-platform
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: true
