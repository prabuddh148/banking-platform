groups:
  - name: service_availability
    interval: 30s
    rules:

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: >
            The service '{{ $labels.job }}' on instance '{{ $labels.instance }}'
            has been unreachable for more than 1 minute.
          runbook_url: "https://wiki.internal/runbooks/service-down"

  - name: http_errors
    interval: 30s
    rules:

      - alert: HighErrorRate
        expr: >
          (
            sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) by (job, uri)
            /
            sum(rate(http_server_requests_seconds_count[5m])) by (job, uri)
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "High 5xx error rate on {{ $labels.job }}"
          description: >
            Service '{{ $labels.job }}' endpoint '{{ $labels.uri }}' is returning
            5xx errors at a rate of {{ $value | humanizePercentage }} over the last 5 minutes.
            This exceeds the 5% threshold.
          runbook_url: "https://wiki.internal/runbooks/high-error-rate"

  - name: http_latency
    interval: 30s
    rules:

      - alert: HighLatency
        expr: >
          histogram_quantile(0.99,
            sum(rate(http_server_requests_seconds_bucket[5m])) by (job, uri, le)
          ) > 2.0
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High p99 latency on {{ $labels.job }}"
          description: >
            The p99 HTTP response time for '{{ $labels.job }}' endpoint '{{ $labels.uri }}'
            is {{ $value | humanizeDuration }}, exceeding the 2-second SLO threshold.
          runbook_url: "https://wiki.internal/runbooks/high-latency"

      - alert: CriticalLatency
        expr: >
          histogram_quantile(0.99,
            sum(rate(http_server_requests_seconds_bucket[5m])) by (job, uri, le)
          ) > 5.0
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Critical p99 latency on {{ $labels.job }}"
          description: >
            The p99 HTTP response time for '{{ $labels.job }}' endpoint '{{ $labels.uri }}'
            is {{ $value | humanizeDuration }}, which is severely degraded (>5s threshold).

  - name: kafka_consumers
    interval: 60s
    rules:

      - alert: KafkaConsumerLag
        expr: kafka_consumer_group_lag > 10000
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High Kafka consumer lag for group {{ $labels.group }}"
          description: >
            Kafka consumer group '{{ $labels.group }}' on topic '{{ $labels.topic }}'
            partition '{{ $labels.partition }}' has a lag of {{ $value }} messages.
          runbook_url: "https://wiki.internal/runbooks/kafka-consumer-lag"

      - alert: KafkaCriticalConsumerLag
        expr: kafka_consumer_group_lag > 50000
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Critical Kafka consumer lag for group {{ $labels.group }}"
          description: >
            Kafka consumer group '{{ $labels.group }}' on topic '{{ $labels.topic }}'
            has a lag of {{ $value }} messages. The service may be stuck or overwhelmed.

  - name: database_connections
    interval: 30s
    rules:

      - alert: DatabaseConnectionPoolExhausted
        expr: >
          (
            hikaricp_connections_active
            /
            hikaricp_connections_max
          ) > 0.90
        for: 2m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "DB connection pool near exhaustion on {{ $labels.job }}"
          description: >
            Service '{{ $labels.job }}' HikariCP pool '{{ $labels.pool }}'
            is at {{ $value | humanizePercentage }} utilization.
            Risk of connection timeout errors if traffic increases.
          runbook_url: "https://wiki.internal/runbooks/db-connection-pool"

      - alert: DatabaseConnectionPoolFull
        expr: hikaricp_connections_active >= hikaricp_connections_max
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "DB connection pool fully exhausted on {{ $labels.job }}"
          description: >
            Service '{{ $labels.job }}' HikariCP pool has reached maximum capacity.
            New database requests will be rejected until connections are released.

  - name: jvm_health
    interval: 30s
    rules:

      - alert: HighJvmMemoryUsage
        expr: >
          (
            jvm_memory_used_bytes{area="heap"}
            /
            jvm_memory_max_bytes{area="heap"}
          ) > 0.85
        for: 5m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "High JVM heap usage on {{ $labels.job }}"
          description: >
            Service '{{ $labels.job }}' heap memory usage is at {{ $value | humanizePercentage }}.
            Risk of OutOfMemoryError if not addressed.
