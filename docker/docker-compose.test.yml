# =============================================================================
# Banking platform - INTEGRATION TEST infrastructure (minimal, throw-away)
#
# Just Postgres + a single-node Kafka (KRaft, no ZooKeeper). Data lives in
# tmpfs, so every `up` starts clean. Uses DIFFERENT host ports than the dev
# stack so both can run at the same time:
#
#   Postgres  localhost:5433  (banking / banking, DBs created by init scripts)
#   Kafka     localhost:9093
#
#   cd docker
#   docker compose -f docker-compose.test.yml up -d --wait
#   DB_PORT=5433 KAFKA_BOOTSTRAP_SERVERS=localhost:9093 mvn -pl account-service verify
#   docker compose -f docker-compose.test.yml down
# =============================================================================
name: banking-platform-test

services:
  postgres-test:
    image: postgres:16.4-alpine
    container_name: banking-test-postgres
    environment:
      POSTGRES_USER: banking
      POSTGRES_PASSWORD: banking
      POSTGRES_DB: banking
    ports:
      - "5433:5432"
    volumes:
      - ./postgresql/init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql/data
    # Faster, non-durable settings - fine for tests, never for real data.
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking -d banking"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  kafka-test:
    image: confluentinc/cp-kafka:7.6.1
    container_name: banking-test-kafka
    hostname: kafka-test
    ports:
      - "9093:9093"
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"  # base64url of 16 bytes
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-test:29094
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29094,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-test:29092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    tmpfs:
      - /var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 15s
