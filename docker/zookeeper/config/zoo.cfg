# ZooKeeper configuration (single node, local development).

# Basic time unit in ms; heartbeats are sent every tickTime.
tickTime=2000
# Ticks a follower may take to connect/sync to the leader (unused in standalone).
initLimit=10
syncLimit=5

# Where snapshots and transaction logs are stored (named docker volumes).
dataDir=/data
dataLogDir=/datalog

# Client port used by Kafka (zookeeper:2181).
clientPort=2181
maxClientCnxns=60

# Single server - no ensemble.
standaloneEnabled=true

# Keep disk usage bounded: keep 3 snapshots, purge every hour.
autopurge.snapRetainCount=3
autopurge.purgeInterval=1

# Four-letter-word commands used for health checks / debugging.
4lw.commands.whitelist=ruok,srvr,stat,mntr

# Disable the embedded admin web server (port 8080 would clash with the gateway's port when run on host).
admin.enableServer=false
