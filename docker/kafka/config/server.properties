# -----------------------------------------------------------------------------
# Kafka broker configuration - single broker for local development.
# Used by docker/kafka/Dockerfile (kafka-server-start <this file>).
# -----------------------------------------------------------------------------

############################# Server Basics #############################
broker.id=1

############################# Socket Server Settings #############################
# Two listeners:
#   INTERNAL - used by containers on the docker network (kafka:29092)
#   EXTERNAL - published to the host (localhost:9092) for IDE runs and tools
listeners=INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
advertised.listeners=INTERNAL://kafka:29092,EXTERNAL://localhost:9092
listener.security.protocol.map=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
inter.broker.listener.name=INTERNAL

num.network.threads=3
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600

############################# Log Basics #############################
log.dirs=/var/lib/kafka/data
# Default partitions for auto-created topics (matches our topic convention).
num.partitions=3
num.recovery.threads.per.data.dir=1

# Topics are created explicitly (kafka-init + NewTopic beans), but auto-create
# stays on so Spring's DeadLetterPublishingRecoverer can never fail on a
# missing .DLT topic in development.
auto.create.topics.enable=true
delete.topic.enable=true

############################# Internal Topic Settings #############################
# Single broker => replication factor 1 everywhere.
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
default.replication.factor=1
min.insync.replicas=1

# Start consumer groups quickly in dev (default is 3s).
group.initial.rebalance.delay.ms=0

############################# Log Retention Policy #############################
# Keep events for 7 days or 1 GiB per partition, whichever first.
log.retention.hours=168
log.retention.bytes=1073741824
log.segment.bytes=268435456
log.retention.check.interval.ms=300000

############################# Zookeeper #############################
zookeeper.connect=zookeeper:2181
zookeeper.connection.timeout.ms=18000

############################# Misc #############################
# Messages are JSON strings; 1 MiB is plenty.
message.max.bytes=1048576
compression.type=producer
