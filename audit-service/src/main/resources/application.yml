server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: audit-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:audit_db}
    username: ${DB_USERNAME:banking}
    password: ${DB_PASSWORD:banking}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: audit-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    # The producer is only used to publish failed messages to the <topic>.DLT topics.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    listener:
      ack-mode: record
      # Don't fail startup if a topic does not exist yet (the producing service creates it).
      missing-topics-fatal: false

jwt:
  secret: ${JWT_SECRET:change-me-dev-secret-key-at-least-32-bytes-long}
  expiry: ${JWT_EXPIRY:PT1H}

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    redis:
      enabled: false
  tracing:
    enabled: ${TRACING_ENABLED:false}
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: audit-service
    description: Immutable audit trail of all platform events

logging:
  level:
    root: INFO
    com.banking: INFO
