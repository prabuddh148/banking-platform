openapi: 3.0.3
info:
  title: Notification Service API
  version: 1.0.0
  description: |
    Read and manage notifications (EMAIL, SMS, PUSH) created from Kafka events
    (`ACCOUNT_CREATED`, `ACCOUNT_STATUS_CHANGED`, `TRANSACTION_COMPLETED`, `TRANSACTION_FAILED`,
    `NOTIFICATION_REQUESTED`). Email goes through SMTP (MailHog locally); SMS and push are simulated.

    Customers only see notifications where `recipientId` is their user id.
    The `recipient` field is masked (e.g. `ra***@example.com`).

    Every response is wrapped in `ApiResponse`. List endpoints return `ApiResponse<PagedResponse<T>>`.
servers:
  - url: http://localhost:8080
    description: Through the API gateway (recommended)
  - url: http://localhost:8084
    description: notification-service directly (still requires a valid JWT)
security:
  - bearerAuth: []
tags:
  - name: Notifications
paths:
  /api/v1/notifications:
    get:
      tags: [Notifications]
      summary: List notifications
      description: Customers get their own. Admins get all and may filter by `recipientId`, `status`, `channel`.
      operationId: listNotifications
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: recipientId
          in: query
          required: false
          description: Admin only filter
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Admin only filter
          schema:
            $ref: '#/components/schemas/NotificationStatus'
        - name: channel
          in: query
          required: false
          description: Admin only filter
          schema:
            $ref: '#/components/schemas/Channel'
      responses:
        '200':
          description: One page of notifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPageApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/notifications/{id}:
    parameters:
      - $ref: '#/components/parameters/NotificationId'
    get:
      tags: [Notifications]
      summary: Get one notification (owner or admin)
      operationId: getNotification
      responses:
        '200':
          description: The notification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/notifications/{id}/retry:
    parameters:
      - $ref: '#/components/parameters/NotificationId'
    post:
      tags: [Notifications]
      summary: Retry sending a failed notification (admin)
      operationId: retryNotification
      responses:
        '200':
          description: Notification after the retry attempt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/notifications/{id}/read:
    parameters:
      - $ref: '#/components/parameters/NotificationId'
    patch:
      tags: [Notifications]
      summary: Mark a notification as read (owner)
      operationId: markAsRead
      responses:
        '200':
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token from `POST /api/v1/auth/login` on the api-gateway.
  parameters:
    NotificationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    Unauthorized:
      description: Missing, invalid or expired token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Forbidden:
      description: Not the recipient / not an admin (`FORBIDDEN`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    NotFound:
      description: Notification not found (`NOTIFICATION_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required: [message, code, status, timestamp]
      properties:
        message:
          type: string
        code:
          type: string
          example: NOTIFICATION_NOT_FOUND
        status:
          type: integer
          example: 404
        details:
          type: object
          additionalProperties:
            type: string
        timestamp:
          type: string
          format: date-time
    ApiErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorResponse'
    PageMetadata:
      type: object
      required: [page, size, totalElements, totalPages, last]
      properties:
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        last:
          type: boolean
    Channel:
      type: string
      enum: [EMAIL, SMS, PUSH]
    NotificationStatus:
      type: string
      description: Delivery status of the notification.
      enum: [PENDING, SENT, FAILED]
    NotificationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        recipientId:
          type: string
          example: CUST-1001
        channel:
          $ref: '#/components/schemas/Channel'
        type:
          type: string
          description: Notification type, e.g. the triggering event
          example: TRANSACTION_COMPLETED
        status:
          $ref: '#/components/schemas/NotificationStatus'
        subject:
          type: string
          example: Your transfer was successful
        message:
          type: string
        recipient:
          type: string
          description: Masked email or phone
          example: ra***@example.com
        attempts:
          type: integer
          example: 1
        errorMessage:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        sentAt:
          type: string
          format: date-time
          nullable: true
    NotificationApiResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/NotificationResponse'
    NotificationPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/NotificationResponse'
    NotificationPageApiResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/NotificationPage'
