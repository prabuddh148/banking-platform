openapi: 3.0.3
info:
  title: Audit Service API
  version: 1.0.0
  description: |
    Read-only access to the immutable audit log. audit-service consumes every event from the
    account, transaction and fraud topics and stores one log row per event (PII masked).

    **All endpoints are admin-only.**

    Severity: `FRAUD_DETECTED` -> CRITICAL (BLOCK) or WARNING (REVIEW);
    `TRANSACTION_FAILED`, `BALANCE_UPDATE_FAILED`, `ACCOUNT_STATUS_CHANGED` -> WARNING; everything else INFO.

    Every response is wrapped in `ApiResponse`. List endpoints return `ApiResponse<PagedResponse<T>>`.
servers:
  - url: http://localhost:8080
    description: Through the API gateway (recommended)
  - url: http://localhost:8085
    description: audit-service directly (still requires a valid JWT)
security:
  - bearerAuth: []
tags:
  - name: Audit logs
  - name: Summary
paths:
  /api/v1/audit/logs:
    get:
      tags: [Audit logs]
      summary: Search audit logs
      operationId: searchLogs
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: eventType
          in: query
          required: false
          schema:
            type: string
            example: TRANSACTION_COMPLETED
        - name: aggregateId
          in: query
          required: false
          schema:
            type: string
        - name: actor
          in: query
          required: false
          schema:
            type: string
            example: CUST-1001
        - name: severity
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Severity'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: One page of audit logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPageApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/audit/logs/{id}:
    get:
      tags: [Audit logs]
      summary: Get one audit log entry
      operationId: getLog
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The log entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/audit/logs/aggregate/{aggregateId}:
    get:
      tags: [Audit logs]
      summary: All logs for one aggregate (account or transaction id)
      operationId: getLogsByAggregate
      parameters:
        - name: aggregateId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of audit logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPageApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/audit/logs/actor/{actor}:
    get:
      tags: [Audit logs]
      summary: All logs for one actor (user id)
      operationId: getLogsByActor
      parameters:
        - name: actor
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of audit logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPageApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/audit/logs/correlation/{correlationId}:
    get:
      tags: [Audit logs]
      summary: All logs sharing one correlation id (one business flow end to end)
      operationId: getLogsByCorrelation
      parameters:
        - name: correlationId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of audit logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPageApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/audit/summary:
    get:
      tags: [Summary]
      summary: Event counts in a time window
      operationId: getSummary
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditSummaryApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token from `POST /api/v1/auth/login` on the api-gateway (admin user).
  parameters:
    From:
      name: from
      in: query
      required: false
      description: ISO-8601 instant (inclusive)
      schema:
        type: string
        format: date-time
        example: '2026-11-01T00:00:00Z'
    To:
      name: to
      in: query
      required: false
      description: ISO-8601 instant
      schema:
        type: string
        format: date-time
        example: '2026-11-30T23:59:59Z'
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    Unauthorized:
      description: Missing, invalid or expired token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Forbidden:
      description: Admin role required (`FORBIDDEN`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    NotFound:
      description: Log entry not found (`AUDIT_LOG_NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required: [message, code, status, timestamp]
      properties:
        message:
          type: string
        code:
          type: string
          example: AUDIT_LOG_NOT_FOUND
        status:
          type: integer
          example: 404
        details:
          type: object
          additionalProperties:
            type: string
        timestamp:
          type: string
          format: date-time
    ApiErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorResponse'
    PageMetadata:
      type: object
      required: [page, size, totalElements, totalPages, last]
      properties:
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        last:
          type: boolean
    Severity:
      type: string
      enum: [INFO, WARNING, CRITICAL]
    AuditLogResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        eventId:
          type: string
          description: The `eventId` of the Kafka event (unique)
        eventType:
          type: string
          example: FRAUD_DETECTED
        aggregateId:
          type: string
        aggregateType:
          type: string
          example: TRANSACTION
        actor:
          type: string
          nullable: true
          example: CUST-1001
        action:
          type: string
          example: Fraud check blocked transaction
        severity:
          $ref: '#/components/schemas/Severity'
        sourceService:
          type: string
          example: fraud-service
        correlationId:
          type: string
          nullable: true
        details:
          type: string
          description: Event payload as JSON text, with PII masked
        occurredAt:
          type: string
          format: date-time
        recordedAt:
          type: string
          format: date-time
    AuditSummaryResponse:
      type: object
      properties:
        totalEvents:
          type: integer
          format: int64
          example: 42
        countsByEventType:
          type: object
          additionalProperties:
            type: integer
            format: int64
          example:
            ACCOUNT_CREATED: 3
            TRANSACTION_COMPLETED: 10
        countsBySeverity:
          type: object
          additionalProperties:
            type: integer
            format: int64
          example:
            INFO: 38
            WARNING: 3
            CRITICAL: 1
        from:
          type: string
          format: date-time
          nullable: true
        to:
          type: string
          format: date-time
          nullable: true
    AuditLogApiResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AuditLogResponse'
    AuditSummaryApiResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AuditSummaryResponse'
    AuditLogPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/AuditLogResponse'
    AuditLogPageApiResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AuditLogPage'
