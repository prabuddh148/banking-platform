server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notifications_db}
    username: ${DB_USERNAME:banking}
    password: ${DB_PASSWORD:banking}

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only checks it matches the entities
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
    listener:
      ack-mode: record

  # SMTP server - MailHog in docker-compose (web UI on port 8025)
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: true

jwt:
  secret: ${JWT_SECRET:change-me-dev-secret-key-at-least-32-bytes-long}
  expiry: ${JWT_EXPIRY:PT1H}

notification:
  mail:
    from: ${MAIL_FROM:no-reply@meridian.bank}
    from-name: ${MAIL_FROM_NAME:Meridian Bank}
  retry:
    max-attempts: ${NOTIFICATION_MAX_ATTEMPTS:3}     # total delivery attempts, including the first one
    interval-ms: ${NOTIFICATION_RETRY_INTERVAL_MS:60000}
    initial-delay-ms: 30000

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  health:
    redis:
      enabled: false
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}   # don't report DOWN just because the SMTP server is not running
  tracing:
    enabled: ${TRACING_ENABLED:false}

logging:
  level:
    com.banking: INFO
