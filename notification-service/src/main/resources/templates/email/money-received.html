<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Money received</title>
</head>
<body style="margin:0;padding:0;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1f2933;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;padding:24px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:8px;">
                <tr>
                    <td style="background:#0b3d91;color:#ffffff;padding:20px 28px;border-radius:8px 8px 0 0;font-size:20px;font-weight:bold;">
                        Meridian Bank
                    </td>
                </tr>
                <tr>
                    <td style="padding:28px;">
                        <h2 style="margin:0 0 16px;color:#1b7f3b;">You have received money</h2>
                        <p>Dear <span th:text="${customerName}">Customer</span>,</p>
                        <p><strong th:text="${amount}">₹1,000.00</strong> has been credited to your account.</p>
                        <table role="presentation" cellpadding="6" cellspacing="0" style="margin:16px 0;font-size:14px;">
                            <tr><td style="color:#616e7c;">Your account</td><td th:text="${accountNumber}">******7890</td></tr>
                            <tr><td style="color:#616e7c;">From account</td><td th:text="${counterpartyAccount}">******1234</td></tr>
                            <tr><td style="color:#616e7c;">Reference</td><td th:text="${reference}">TXN20260101ABCDEFGH</td></tr>
                            <tr th:if="${description != null and !#strings.isEmpty(description)}">
                                <td style="color:#616e7c;">Description</td><td th:text="${description}">Rent</td>
                            </tr>
                            <tr><td style="color:#616e7c;">Date</td><td th:text="${date}">01 Jan 2026, 10:00 AM</td></tr>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td style="padding:16px 28px;font-size:12px;color:#9aa5b1;border-top:1px solid #e4e7eb;">
                        This is an automated message. Never share your password or OTP with anyone.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
