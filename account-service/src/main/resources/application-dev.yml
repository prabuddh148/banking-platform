# Local development tweaks: run with --spring.profiles.active=dev
spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.banking: DEBUG
    org.springframework.kafka: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
